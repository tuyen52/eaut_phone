<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quên mật khẩu - EAUT Phone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/premium-home.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .forgot-box {
            width: min(440px, calc(100vw - 28px));
            background: rgba(255,255,255,.9);
            border: 1px solid rgba(15, 23, 42, 0.08);
            border-radius: 24px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.1);
            padding: 28px;
            text-align: center;
            backdrop-filter: blur(14px);
        }
        .forgot-box h2 { color: #101828; margin-bottom: 12px; letter-spacing: .4px; }
        .forgot-box p { color: #667085; line-height: 1.6; margin-bottom: 18px; }
        .forgot-box input {
            width: 100%;
            padding: 12px 14px;
            margin: 10px 0;
            border: 1px solid rgba(15, 23, 42, 0.12);
            border-radius: 14px;
            box-sizing: border-box;
            background: #fff;
        }
        .forgot-box input:focus {
            border-color: rgba(11, 87, 208, 0.35);
            box-shadow: 0 0 0 4px rgba(11, 87, 208, 0.08);
        }
        .forgot-box button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0b57d0 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(11, 87, 208, 0.18);
        }
        .forgot-box button:hover { filter: brightness(1.02); }
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #0b57d0;
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="forgot-box">
        <h2>QUÊN MẬT KHẨU</h2>
        <p>Vui lòng nhập tên tài khoản và email đăng ký để xác minh.</p>
        
        <input type="text" id="userInput" placeholder="Nhập tên tài khoản..." required>
        
        <input type="email" id="emailInput" placeholder="Nhập email của bạn..." required>
        
        <button onclick="guiYeuCau()" id="btnGui">GỬI YÊU CẦU</button>
        
        <a href="index.html" class="back-link">Quay lại trang chủ</a>
    </div>

    <script>
        function guiYeuCau() {
            var username = document.getElementById('userInput').value.trim();
            var email = document.getElementById('emailInput').value.trim();
            var btn = document.getElementById('btnGui');

            // Kiểm tra phải nhập cả 2 ô
            if(username === "" || email === "") {
                alert("Vui lòng nhập đầy đủ Tên tài khoản và Email!");
                return;
            }

            // Hiệu ứng loading
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Đang xử lý...';
            btn.disabled = true;
            btn.style.background = "#ccc";

            fetch('php/forgot-password.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: username, 
                    email: email 
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.status) {
                    alert("THÀNH CÔNG: " + data.message);
                    window.location.href = 'index.html'; // Về trang chủ để đăng nhập
                } else {
                    alert("LỖI: " + data.message);
                    // Reset nút bấm
                    btn.innerHTML = 'GỬI YÊU CẦU';
                    btn.disabled = false;
                    btn.style.background = "#f7941e";
                }
            })
            .catch(err => {
                console.error(err);
                alert("Lỗi kết nối Server!");
                btn.innerHTML = 'GỬI YÊU CẦU';
                btn.disabled = false;
                btn.style.background = "#f7941e";
            });
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="css/chatbot.css">
    <script src="js/components/chatbot.js"></script>
</body>
</html>
